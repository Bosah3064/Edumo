<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="edumoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7ac2" />
      <stop offset="100%" stop-color="#1d5f99" />
    </linearGradient>
    <linearGradient id="edumoPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a488c" />
      <stop offset="100%" stop-color="#683669" />
    </linearGradient>
    <linearGradient id="edumoRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c93250" />
      <stop offset="100%" stop-color="#a5243d" />
    </linearGradient>
    <linearGradient id="edumoSunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a5243d" />
      <stop offset="100%" stop-color="#e24867" />
    </linearGradient>
    <filter id="edumoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="100" height="100" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />

  <!-- Rising Sun Behind Cap -->
  <g filter="url(#edumoShadow)">
    <path d="M50 15 L52 23 L48 23 Z" fill="url(#edumoSunGrad)" />
    <path d="M41 18 L45 25 L42 27 Z" fill="url(#edumoSunGrad)" />
    <path d="M59 18 L58 27 L55 25 Z" fill="url(#edumoSunGrad)" />
    <path d="M34 23 L40 28 L38 31 Z" fill="url(#edumoSunGrad)" />
    <path d="M66 23 L62 31 L60 28 Z" fill="url(#edumoSunGrad)" />
    <circle cx="50" cy="30" r="14" fill="url(#edumoSunGrad)" opacity="0.95" />
  </g>

  <!-- Left Blue Wing -->
  <path d="M22 28 C20 40 24 54 48 57 C33 54 28 42 27 34 C25 32 23 30 22 28 Z" fill="url(#edumoBlueGrad)" />
  <path d="M20 38 C18 48 24 60 46 64 C33 60 26 50 25 42 Z" fill="url(#edumoBlueGrad)" />

  <!-- Right Blue Wing -->
  <path d="M78 28 C80 40 76 54 52 57 C67 54 72 42 73 34 C75 32 77 30 78 28 Z" fill="url(#edumoBlueGrad)" />
  <path d="M80 38 C82 48 76 60 54 64 C67 60 74 50 75 42 Z" fill="url(#edumoBlueGrad)" />

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#edumoShadow)">
    <polygon points="50,26 66,32 50,38 34,32" fill="#ffffff" />
    <polygon points="50,28 64,32 50,37 36,32" fill="url(#edumoPurpleGrad)" />
    <path d="M42 36 L42 42 C42 45 46 47 50 47 C54 47 58 45 58 42 L58 36 Z" fill="url(#edumoPurpleGrad)" />
    <path d="M50 32 C54 33 59 36 60 41" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="42" r="1.5" fill="url(#edumoRedGrad)" />
  </g>

  <!-- Open Book Base (Purple & Blue layers with Crimson spine) -->
  <g filter="url(#edumoShadow)">
    <path d="M50 63 C44 58 35 58 26 61 L26 77 C35 74 44 74 50 79 Z" fill="url(#edumoBlueGrad)" />
    <path d="M50 64 C45 61 37 61 30 63 L30 75 C37 73 45 73 50 77 Z" fill="url(#edumoPurpleGrad)" />

    <path d="M50 63 C56 58 65 58 74 61 L74 77 C65 74 56 74 50 79 Z" fill="url(#edumoBlueGrad)" />
    <path d="M50 64 C55 61 63 61 70 63 L70 75 C63 73 55 73 50 77 Z" fill="url(#edumoPurpleGrad)" />

    <path d="M49 52 L51 52 L52 79 L48 79 Z" fill="url(#edumoRedGrad)" />
  </g>
</svg>
